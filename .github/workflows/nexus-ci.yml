name: NEXUS CI

on:
  pull_request:
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-ci.yml"
  push:
    branches:
      - nexus-secure-foundation
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nexus/package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
