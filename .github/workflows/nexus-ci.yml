name: NEXUS CI

on:
  pull_request:
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-ci.yml"
  push:
    branches:
      - nexus-secure-foundation
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend
        working-directory: nexus
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: nexus
        run: npm run build

      - name: Install functions
        working-directory: nexus/functions
        run: npm install --no-audit --no-fund

      - name: Check function syntax
        working-directory: nexus/functions
        run: node --check index.js
